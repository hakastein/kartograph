name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: internal/ladybug/lib
          key: ladybug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/ladybug/fetch.sh') }}
      - run: make go
